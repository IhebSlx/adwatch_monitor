# After that, add / rename / remove companies live in the dashboard UI — those
# edits live in the database and are NOT overwritten by this file.
# Use the "Re-seed from file" button in the UI if you ever want to reset to this list.
#
# resolution_status: pending | confirmed | ambiguous | no_ads_found
