#     the Meta Ad Library by this exact name, matches the best page, and auto-confirms.
#   - confirmed: page_id is locked in; future runs fetch that page directly.
#   - ambiguous / no_ads_found: check the dashboard — may need a manual look at the
#     exact company name or the Facebook page.

